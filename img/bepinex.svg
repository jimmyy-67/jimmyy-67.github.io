<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Gradiente oficial para las letras "Ex" -->
    <linearGradient id="exGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF19D" />
      <stop offset="50%" stop-color="#FFA0B2" />
      <stop offset="100%" stop-color="#FF6C8E" />
    </linearGradient>

    <!-- Estilo del cuerpo tubular -->
    <style>
      .maze-pipe {
        fill: none;
        stroke-width: 84px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <!-- Ruta exacta del laberinto del cuerpo -->
    <path id="bodyMazePath" d="
      M 270,120
      L 120,120
      A 48,48 0 0,0 72,168
      L 72,222
      A 48,48 0 0,0 120,270
      L 212,270
      A 48,48 0 0,1 260,318
      L 260,392
      A 48,48 0 0,1 212,440
      L 120,440
      A 48,48 0 0,0 72,488
      L 72,562
      A 48,48 0 0,0 120,610
      L 327,610
      A 48,48 0 0,0 375,562
      L 375,200
      A 125,125 0 0,1 625,200
      L 625,562
      A 48,48 0 0,0 673,610
      L 880,610
      A 48,48 0 0,0 928,562
      L 928,488
      A 48,48 0 0,0 880,440
      L 788,440
      A 48,48 0 0,1 740,392
      L 740,318
      A 48,48 0 0,1 788,270
      L 880,270
      A 48,48 0 0,0 928,222
      L 928,168
      A 48,48 0 0,0 880,120
      L 730,120
    " />
  </defs>

  <!-- GRUPO PRINCIPAL DE LA MASCOTA -->
  <g id="BepInExMascot">
    <!-- Sombra 3D del cuerpo -->
    <use href="#bodyMazePath" class="maze-pipe" stroke="#27140C" transform="translate(4, 12)" />

    <!-- Cuerpo Marrón Principal -->
    <use href="#bodyMazePath" class="maze-pipe" stroke="#6A3E2D" />

    <!-- CARA EXACTA DEL PERRO -->
    <g id="DogFace">
      <!-- Ojo Izquierdo -->
      <circle cx="428" cy="142" r="23" fill="#180A05" />

      <!-- Ojo Derecho -->
      <circle cx="572" cy="142" r="23" fill="#180A05" />

      <!-- Hocico / Mofletes (Amarillo Crema) -->
      <path d="
        M 500,195
        C 475,188 412,202 412,235
        C 412,268 448,274 476,256
        C 488,248 512,248 524,256
        C 552,274 588,268 588,235
        C 588,202 525,188 500,195 Z
      " fill="#FFE885" />

      <!-- Lengua (Rosa) -->
      <path d="
        M 482,248
        Q 500,276 518,248
        Z
      " fill="#FF829B" />

      <!-- Nariz (Negra con bordes suaves) -->
      <path d="
        M 482,192
        C 482,183 518,183 518,192
        C 518,208 508,214 500,214
        C 492,214 482,208 482,192 Z
      " fill="#180A05" />
    </g>
  </g>

  <!-- TEXTO VECTORIAL EXACTO "BepInEx" -->
  <g id="BepInText">
    <!-- Sombra del Texto -->
    <g fill="#27140C" transform="translate(4, 10)">
      <!-- B -->
      <path fill-rule="evenodd" d="M 48,775 L 115,775 C 142,775 142,832 118,832 C 148,832 148,900 115,900 L 48,900 Z M 78,798 L 108,798 C 120,798 120,816 108,816 L 78,816 Z M 78,844 L 110,844 C 122,844 122,877 110,877 L 78,877 Z" />
      <!-- e -->
      <path fill-rule="evenodd" d="M 232,810 C 195,810 170,835 170,865 C 170,898 195,908 232,908 C 260,908 280,895 285,875 L 255,875 C 252,883 244,887 232,887 C 212,887 200,875 200,862 L 286,862 C 287,857 287,850 286,844 C 282,822 260,810 232,810 Z M 200,844 C 204,831 216,826 232,826 C 248,826 258,831 261,844 Z" />
      <!-- p -->
      <path fill-rule="evenodd" d="M 312,812 L 340,812 L 340,828 C 350,816 366,810 388,810 C 420,810 442,832 442,865 C 442,898 420,908 388,908 C 366,908 350,902 340,890 L 340,948 A 14,14 0 0,1 312,948 Z M 376,832 C 356,832 340,845 340,865 C 340,885 356,888 376,888 C 398,888 412,885 412,865 C 412,845 398,832 376,832 Z" />
      <!-- I -->
      <path d="M 465,787 A 15,15 0 0,1 495,787 L 495,893 A 15,15 0 0,1 465,893 Z" />
      <!-- n -->
      <path fill-rule="evenodd" d="M 525,812 L 553,812 L 553,828 C 563,816 578,810 600,810 C 625,810 640,824 640,852 L 640,900 L 612,900 L 612,856 C 612,838 603,830 587,830 C 569,830 553,842 553,863 L 553,900 L 525,900 Z" />
      <!-- E -->
      <path d="M 670,775 L 755,775 A 14,14 0 0,1 755,803 L 698,803 L 698,827 L 745,827 A 14,14 0 0,1 745,855 L 698,855 L 698,872 L 755,872 A 14,14 0 0,1 755,900 L 670,900 Z" />
      <!-- x -->
      <path d="M 785,812 A 14,14 0 0,1 805,812 L 832,847 L 859,812 A 14,14 0 0,1 879,830 L 850,862 L 879,895 A 14,14 0 0,1 859,913 L 832,877 L 805,913 A 14,14 0 0,1 785,895 L 814,862 L 785,830 A 14,14 0 0,1 785,812 Z" />
    </g>

    <!-- Texto "BepIn" (Marrón) -->
    <g fill="#6A3E2D">
      <!-- B -->
      <path fill-rule="evenodd" d="M 48,775 L 115,775 C 142,775 142,832 118,832 C 148,832 148,900 115,900 L 48,900 Z M 78,798 L 108,798 C 120,798 120,816 108,816 L 78,816 Z M 78,844 L 110,844 C 122,844 122,877 110,877 L 78,877 Z" />
      <!-- e -->
      <path fill-rule="evenodd" d="M 232,810 C 195,810 170,835 170,865 C 170,898 195,908 232,908 C 260,908 280,895 285,875 L 255,875 C 252,883 244,887 232,887 C 212,887 200,875 200,862 L 286,862 C 287,857 287,850 286,844 C 282,822 260,810 232,810 Z M 200,844 C 204,831 216,826 232,826 C 248,826 258,831 261,844 Z" />
      <!-- p -->
      <path fill-rule="evenodd" d="M 312,812 L 340,812 L 340,828 C 350,816 366,810 388,810 C 420,810 442,832 442,865 C 442,898 420,908 388,908 C 366,908 350,902 340,890 L 340,948 A 14,14 0 0,1 312,948 Z M 376,832 C 356,832 340,845 340,865 C 340,885 356,888 376,888 C 398,888 412,885 412,865 C 412,845 398,832 376,832 Z" />
      <!-- I -->
      <path d="M 465,787 A 15,15 0 0,1 495,787 L 495,893 A 15,15 0 0,1 465,893 Z" />
      <!-- n -->
      <path fill-rule="evenodd" d="M 525,812 L 553,812 L 553,828 C 563,816 578,810 600,810 C 625,810 640,824 640,852 L 640,900 L 612,900 L 612,856 C 612,838 603,830 587,830 C 569,830 553,842 553,863 L 553,900 L 525,900 Z" />
    </g>

    <!-- Texto "Ex" (Gradiente Amarillo-Rosa) -->
    <g fill="url(#exGradient)">
      <!-- E -->
      <path d="M 670,775 L 755,775 A 14,14 0 0,1 755,803 L 698,803 L 698,827 L 745,827 A 14,14 0 0,1 745,855 L 698,855 L 698,872 L 755,872 A 14,14 0 0,1 755,900 L 670,900 Z" />
      <!-- x -->
      <path d="M 785,812 A 14,14 0 0,1 805,812 L 832,847 L 859,812 A 14,14 0 0,1 879,830 L 850,862 L 879,895 A 14,14 0 0,1 859,913 L 832,877 L 805,913 A 14,14 0 0,1 785,895 L 814,862 L 785,830 A 14,14 0 0,1 785,812 Z" />
    </g>
  </g>
</svg>
