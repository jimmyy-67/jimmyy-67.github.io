<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 720" role="img" aria-labelledby="title desc">
  <title id="title">Refished Wiki</title>
  <desc id="desc">A dreamlike underwater scene where fish rise from an open book.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0c83b0"/>
      <stop offset=".5" stop-color="#09688f"/>
      <stop offset="1" stop-color="#064665"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#87d5eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffe8df"/>
      <stop offset=".55" stop-color="#ffc5ba"/>
      <stop offset="1" stop-color="#df8f91"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8df"/>
      <stop offset="1" stop-color="#f1abb0"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3da"/>
      <stop offset=".6" stop-color="#ffbfad"/>
      <stop offset="1" stop-color="#da8394"/>
    </linearGradient>
    <filter id="waterTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="24"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02243a" flood-opacity=".46"/>
    </filter>
    <filter id="fishGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd9c6" flood-opacity=".6"/>
    </filter>
    <g id="fishShape" filter="url(#fishGlow)">
      <path d="M-38 0c13-22 50-27 73-8 7 5 11 5 17 0l14-13-3 21 3 21-14-13c-6-5-10-5-17 0-23 19-60 14-73-8Z" fill="url(#fish)" stroke="#ffe9d4" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-4-14c10-13 24-16 35-13" fill="none" stroke="#fff8e8" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
      <path d="M4 15c9 11 21 14 31 12" fill="none" stroke="#cc7186" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <circle cx="28" cy="-5" r="3.5" fill="#15475d"/>
      <circle cx="29" cy="-6" r="1.1" fill="#fff"/>
    </g>
  </defs>

  <rect width="512" height="720" fill="url(#water)"/>
  <rect width="512" height="720" filter="url(#waterTexture)" opacity=".14"/>
  <path d="M0 0h512v112c-53-28-104 17-164 2-64-16-107-55-171-22C120 123 56 73 0 98Z" fill="url(#surface)" opacity=".7"/>
  <path d="M-20 83c71-48 111 18 183-9 68-25 99-44 165-12 58 28 117-10 204 18" fill="none" stroke="#e4f7ff" stroke-opacity=".36" stroke-width="7"/>
  <path d="M-12 116c74-34 124 31 199-2 63-27 106-40 164-10 62 31 110-20 182-2" fill="none" stroke="#9ae5f4" stroke-opacity=".25" stroke-width="5"/>

  <g fill="none" stroke="#dffaff" stroke-linecap="round">
    <path d="M70 163c-10 33 15 47 2 70" stroke-width="4" stroke-opacity=".45"/>
    <path d="M442 208c15 34-4 50 10 70" stroke-width="3" stroke-opacity=".38"/>
    <path d="M114 304c-8 27 12 42 2 62" stroke-width="3" stroke-opacity=".28"/>
  </g>
  <g fill="#ecfbff">
    <circle cx="125" cy="123" r="5" opacity=".78"/><circle cx="144" cy="96" r="3" opacity=".66"/><circle cx="148" cy="74" r="2" opacity=".45"/>
    <circle cx="341" cy="171" r="5" opacity=".67"/><circle cx="355" cy="142" r="3" opacity=".57"/><circle cx="362" cy="121" r="2" opacity=".42"/>
    <circle cx="221" cy="395" r="4" opacity=".56"/><circle cx="235" cy="369" r="2" opacity=".42"/><circle cx="204" cy="347" r="3" opacity=".52"/>
  </g>

  <g>
    <use href="#fishShape" transform="translate(270 462) rotate(-18) scale(.8)"/>
    <use href="#fishShape" transform="translate(210 398) rotate(10) scale(.56)"/>
    <use href="#fishShape" transform="translate(297 330) rotate(-26) scale(.64)"/>
    <use href="#fishShape" transform="translate(190 268) rotate(18) scale(.45)"/>
    <use href="#fishShape" transform="translate(314 213) rotate(-12) scale(.5)"/>
    <use href="#fishShape" transform="translate(235 154) rotate(21) scale(.34)"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M66 573c63 1 126 11 190 40l-15 84c-58-30-119-40-184-40Z" fill="url(#page)" stroke="#ffe9df" stroke-width="5" stroke-linejoin="round"/>
    <path d="M446 573c-63 1-126 11-190 40l15 84c58-30 119-40 184-40Z" fill="url(#pageRight)" stroke="#ffe9df" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 613v77" fill="none" stroke="#bd687b" stroke-width="6" stroke-linecap="round"/>
    <path d="M58 657c66 0 125 12 184 40M454 657c-66 0-125 12-184 40" fill="none" stroke="#9d566d" stroke-opacity=".58" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g stroke="#d7828c" stroke-opacity=".48" stroke-width="3" stroke-linecap="round">
    <path d="M94 604l113 22M90 620l107 21M306 627l108-20M315 644l94-18"/>
  </g>
  <g fill="none" stroke="#f6e7dc" stroke-linecap="round">
    <path d="M126 564c18-34 37-39 57-58 18-17 20-44 44-61" stroke-width="6" stroke-opacity=".73"/>
    <path d="M157 574c17-38 44-43 61-71 13-21 13-36 28-56" stroke-width="4" stroke-opacity=".65"/>
    <path d="M287 564c-17-34-32-42-49-64" stroke-width="5" stroke-opacity=".65"/>
  </g>
  <path d="M0 704c80-19 146 16 244-1 106-19 167 15 268-3v20H0Z" fill="#04364f" opacity=".65"/>
</svg>
