<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Refished Wiki</title>
  <desc id="desc">An underwater field guide with a swimming fish, coral and a search lens.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#173953"/>
      <stop offset="0.54" stop-color="#0c2032"/>
      <stop offset="1" stop-color="#071219"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfbff"/>
      <stop offset="1" stop-color="#70b6c7"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffca70"/>
      <stop offset="0.58" stop-color="#ff5b5b"/>
      <stop offset="1" stop-color="#e40a47"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6576"/>
      <stop offset="1" stop-color="#a90836"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="34" y="34" width="444" height="444" rx="72"/>
    </clipPath>
  </defs>

  <rect x="34" y="34" width="444" height="444" rx="72" fill="url(#ocean)" stroke="#8eeeff" stroke-opacity=".42" stroke-width="6"/>
  <g clip-path="url(#clip)">
    <path d="M0 115C90 68 151 176 250 122S419 65 540 113" fill="none" stroke="#75e9ff" stroke-opacity=".13" stroke-width="14"/>
    <path d="M-16 145C71 98 159 202 262 149S440 94 532 145" fill="none" stroke="#75e9ff" stroke-opacity=".08" stroke-width="8"/>
    <g fill="#b7f7ff" opacity=".55">
      <circle cx="98" cy="102" r="7"/><circle cx="120" cy="77" r="4"/><circle cx="424" cy="184" r="5"/>
      <circle cx="399" cy="149" r="9"/><circle cx="100" cy="198" r="3"/><circle cx="434" cy="238" r="3"/>
    </g>
    <path d="M42 416c54-25 94-23 140-2 53 25 105 20 153-5 49-25 103-26 159 0v78H22Z" fill="#0a1a20"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M78 184c63-28 121-20 177 22v177c-56-41-115-49-177-21V184Z" fill="url(#paper)" stroke="#dbfbff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M434 184c-63-28-121-20-178 22v177c57-41 115-49 178-21V184Z" fill="url(#paper)" stroke="#dbfbff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M256 206v177" fill="none" stroke="#3a7184" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g opacity=".62" stroke="#276177" stroke-width="8" stroke-linecap="round">
    <path d="M282 253h99M282 278h72M282 303h92M282 328h57"/>
    <path d="M108 331h76M108 352h105"/>
  </g>

  <g filter="url(#glow)">
    <path d="M108 246c19-39 67-58 113-40 19 7 34 20 45 37-21 11-35 28-43 50-40 11-82-7-102-41l-36 22 11-42-14-38 35 22c-4 10-6 20-9 30Z" fill="url(#fish)" stroke="#ffe3b0" stroke-width="5" stroke-linejoin="round"/>
    <path d="M148 224c15-18 34-26 58-24" fill="none" stroke="#ffe7b5" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="234" r="7" fill="#0a1a20"/>
    <circle cx="192" cy="231" r="2.5" fill="#ffffff"/>
  </g>

  <g transform="translate(365 94)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#102b3d" stroke="#8eeeff" stroke-width="8"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#ff5269" stroke-width="7" stroke-dasharray="12 8"/>
    <path d="M34 34 70 70" fill="none" stroke="#8eeeff" stroke-width="14" stroke-linecap="round"/>
    <path d="M-12 0h24M0-12v24" stroke="#d9fcff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M287 155h43v60l-21.5-15-21.5 15v-60Z" fill="#e40a47" stroke="#ff9aa6" stroke-width="4" stroke-linejoin="round"/>
  <g fill="url(#coral)" stroke="#ff9aa6" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 437v-50m0 22-24-25m24 4 26-28m-50 77-16-22m187 22v-58m0 29 25-27m-25 6-22-24m55 74 17-23m83 23v-44m0 19 20-20m-20 2-17-18m42 61 14-18" fill="none"/>
  </g>
  <path d="M73 455h366" stroke="#80e7ef" stroke-opacity=".32" stroke-width="4" stroke-linecap="round"/>
</svg>
