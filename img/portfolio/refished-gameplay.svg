<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2847"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#deep)"/>
  <!-- Seaweed -->
  <path d="M100,450 Q110,380 95,310 Q80,240 100,170" stroke="#2d6a4f" stroke-width="8" fill="none" opacity="0.6"/>
  <path d="M130,450 Q140,390 125,330 Q110,270 130,200" stroke="#40916c" stroke-width="6" fill="none" opacity="0.5"/>
  <path d="M680,450 Q690,370 675,290 Q660,210 680,140" stroke="#2d6a4f" stroke-width="7" fill="none" opacity="0.6"/>
  <!-- Fish 1 -->
  <ellipse cx="350" cy="200" rx="60" ry="30" fill="#c7ed48" opacity="0.8"/>
  <polygon points="410,200 440,175 440,225" fill="#c7ed48" opacity="0.8"/>
  <circle cx="315" cy="192" r="6" fill="#fff"/>
  <!-- Fish 2 -->
  <ellipse cx="550" cy="300" rx="45" ry="22" fill="#ff765d" opacity="0.7"/>
  <polygon points="595,300 620,280 620,320" fill="#ff765d" opacity="0.7"/>
  <circle cx="525" cy="294" r="5" fill="#fff"/>
  <!-- Light rays -->
  <line x1="300" y1="0" x2="350" y2="450" stroke="#ffffff" stroke-width="40" opacity="0.03"/>
  <line x1="500" y1="0" x2="450" y2="450" stroke="#ffffff" stroke-width="60" opacity="0.03"/>
  <!-- HUD elements -->
  <rect x="20" y="20" width="120" height="8" rx="4" fill="#ffffff20"/>
  <rect x="20" y="20" width="80" height="8" rx="4" fill="#c7ed48" opacity="0.8"/>
  <text x="400" y="430" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#8a8a92" letter-spacing="3">GAMEPLAY</text>
</svg>
