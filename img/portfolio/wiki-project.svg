<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8f9fa"/>
  <!-- Wiki header -->
  <rect x="0" y="0" width="800" height="60" fill="#2d2d2d"/>
  <text x="40" y="38" font-family="Segoe UI, sans-serif" font-size="20" fill="#fff" font-weight="700">Feed and Grow: Refished Wiki</text>
  <!-- Sidebar -->
  <rect x="0" y="60" width="200" height="390" fill="#f0f0f0"/>
  <rect x="10" y="75" width="180" height="28" rx="4" fill="#e0e0e0"/>
  <rect x="10" y="110" width="180" height="28" rx="4" fill="transparent"/>
  <rect x="10" y="145" width="180" height="28" rx="4" fill="transparent"/>
  <rect x="10" y="180" width="180" height="28" rx="4" fill="transparent"/>
  <text x="20" y="94" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Main Page</text>
  <text x="20" y="129" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">Fish Species</text>
  <text x="20" y="164" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">Maps</text>
  <text x="20" y="199" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">Mechanics</text>
  <!-- Content area -->
  <text x="230" y="95" font-family="Segoe UI, sans-serif" font-size="22" fill="#333" font-weight="700">Welcome to the Wiki</text>
  <rect x="230" y="110" width="540" height="2" fill="#e0e0e0"/>
  <rect x="230" y="130" width="500" height="10" rx="4" fill="#ddd"/>
  <rect x="230" y="148" width="460" height="10" rx="4" fill="#ddd"/>
  <rect x="230" y="166" width="520" height="10" rx="4" fill="#ddd"/>
  <!-- Fish card -->
  <rect x="230" y="200" width="160" height="120" rx="8" fill="#e8f4f8"/>
  <ellipse cx="310" cy="250" rx="40" ry="20" fill="#ff765d" opacity="0.7"/>
  <polygon points="350,250 370,235 370,265" fill="#ff765d" opacity="0.7"/>
  <text x="310" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" font-weight="600">Bass</text>
  <!-- Fish card 2 -->
  <rect x="410" y="200" width="160" height="120" rx="8" fill="#e8f4f8"/>
  <ellipse cx="490" cy="250" rx="35" ry="18" fill="#c7ed48" opacity="0.7"/>
  <polygon points="525,250 545,237 545,263" fill="#c7ed48" opacity="0.7"/>
  <text x="490" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" font-weight="600">Piranha</text>
  <!-- Fish card 3 -->
  <rect x="590" y="200" width="160" height="120" rx="8" fill="#e8f4f8"/>
  <ellipse cx="670" cy="250" rx="45" ry="22" fill="#74b9ff" opacity="0.7"/>
  <polygon points="715,250 740,232 740,268" fill="#74b9ff" opacity="0.7"/>
  <text x="670" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" font-weight="600">Pike</text>
  <!-- Stats -->
  <rect x="230" y="340" width="540" height="80" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="250" y="365" font-family="Segoe UI, sans-serif" font-size="12" fill="#333" font-weight="600">Project Stats</text>
  <text x="250" y="390" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">42 articles · 128 images · 15 contributors</text>
</svg>
