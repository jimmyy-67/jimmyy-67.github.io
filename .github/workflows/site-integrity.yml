name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Revalida los servicios externos cada lunes a las 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # para poder abrir una incidencia si el chequeo programado falla

jobs:
  local-integrity:
    name: Assets, metadata and anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest data
        run: npm run validate-manifest:local

      - name: Check local integrity
        run: npm run check-links:local

  external-links:
    name: External links
    # Evita que bloqueos temporales de terceros vuelvan inestables todos los
    # pull requests; la red se comprueba al publicar, semanalmente y a mano.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest data (with network)
        run: npm run validate-manifest

      - name: Check all links
        run: npm run check-links

  # Los chequeos programados nadie los mira: si fallan, se abre una incidencia
  # (y se avisa a Discord si el secreto está configurado) en vez de quedarse
  # en silencio dentro de la pestaña Actions.
  notify:
    needs: [local-integrity, external-links]
    if: always() && (needs.local-integrity.result == 'failure' || needs.external-links.result == 'failure')
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: "Site integrity"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      details: "Revisa manifest.js (validación), los enlaces externos y el presupuesto de medios; los bloqueos puntuales de terceros también cuentan como fallo."
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
