name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Revalida los servicios externos cada lunes a las 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-integrity:
    name: Assets, metadata and anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check local integrity
        run: npm run check-links:local

      # Metadatos sociales, textos alternativos, datos estructurados y
      # consistencia entre index.html, manifest.js, sitemap.xml y stats.json.
      - name: Check content and metadata
        run: npm run check-content

  external-links:
    name: External links
    # Evita que bloqueos temporales de terceros vuelvan inestables todos los
    # pull requests; la red se comprueba al publicar, semanalmente y a mano.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check all links
        run: npm run check-links
