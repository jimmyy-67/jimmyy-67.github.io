name: Render Hoverfish banner (Megazoid)

# Descarga la demo personal-use de Megazoid (DJR) EN EL RUNNER —que sí tiene
# internet abierto—, renderiza el banner de Hoverfish Hats con sharp y
# commitea únicamente el PNG resultante a la rama que disparó el workflow.
# La fuente no se redistribuye: solo se usa para rasterizar el banner.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-hf-banner
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sharp
        run: npm i sharp --no-save

      - name: Fetch Megazoid demo font (runner-side)
        run: |
          set -e
          mkdir -p "$HOME/.local/share/fonts" /tmp/mz
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          PAGE=$(curl -sL -A "$UA" https://befonts.com/megazoid-font.html)
          URL=$(printf '%s' "$PAGE" | grep -o 'https://befonts.com/downfile/[^"]*' | head -1)
          echo "downfile url: $URL"
          test -n "$URL"
          curl -sL -A "$UA" -e "https://befonts.com/megazoid-font.html" "$URL" -o /tmp/mz/font.zip
          ls -la /tmp/mz
          unzip -o /tmp/mz/font.zip -d /tmp/mz/extract
          find /tmp/mz/extract \( -iname '*.otf' -o -iname '*.ttf' \) -print -exec cp {} "$HOME/.local/share/fonts/" \;
          fc-cache -f || true
          fc-list | grep -i megazoid || echo "WARN: megazoid not in fontconfig"

      - name: Render banner
        run: node scripts/render-hf-banner.mjs

      - name: Commit banner if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/mods/hoverfish-hats.png
          if git diff --staged --quiet; then
            echo "Sin cambios en el banner."
          else
            git commit -m "chore(mods): render Hoverfish Hats banner with Megazoid title"
            git push
          fi
