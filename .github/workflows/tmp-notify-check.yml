name: Tmp notify check

# TEMPORAL: solo para validar de punta a punta el workflow reutilizable
# notify-failure.yml (parseo, creación de la incidencia y omisión de Discord
# cuando el webhook no está configurado). Se borra en cuanto se compruebe.

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notify:
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: "Comprobación temporal del aviso"
      run_url: https://github.com/jimmyy-67/jimmyy-67.github.io/actions/runs/0
      details: "Ejecución de prueba del aviso de fallo; no hay ningún workflow roto."
